name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Basic secret pattern check
        run: |
          # Build the pattern from fragments so this workflow file itself
          # does not trip the secret scan it runs.
          GH='gh'; UND='p_'
          S='sk'; DA='-'
          XO='xo'; XB='xb-'
          AK='AK'; IA='IA'
          BG='BEGIN'; PK=' PRIVATE KEY'
          TBT='TELEGRAM_BOT_TOKEN'
          CSEC='CLIENT_SECRET'
          EQ='='
          PATTERN="(${GH}${UND}|${S}${DA}|${XO}${XB}|${AK}${IA}|${BG}${PK}|${TBT}${EQ}.+|${CSEC}${EQ}.+)"
          if git grep -n -E "$PATTERN" -- ':!package-lock.json' ':!.env.example'; then
            echo "Potential secret found. Please review."
            exit 1
          fi

      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Generate Prisma client
        if: hashFiles('prisma/schema.prisma') != ''
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/verification_tool
        run: npm run db:generate

      - name: Validate Prisma schema
        if: hashFiles('prisma/schema.prisma') != ''
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/verification_tool
        run: npm run db:validate

      - name: Run verify (lint + typecheck + test + build)
        if: hashFiles('package.json') != ''
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/verification_tool
        run: npm run verify